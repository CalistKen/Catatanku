<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatanku - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .note-item { cursor: pointer; transition: 0.2s; border-left: none; border-right: none; }
        .note-item:active { background-color: rgba(0,0,0,0.05); }
        .preview-text {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-size: 0.85rem;
            color: #6c757d;
        }
        .btn-fab { position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px; border-radius: 50%; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body class="bg-body-tertiary">

    <nav class="navbar bg-body shadow-sm sticky-top mb-3">
        <div class="container-fluid px-3">
            <span class="navbar-brand mb-0 h1 text-primary fw-bold"><i class="bi bi-book-half"></i> Catatanku</span>
            <button class="btn btn-outline-danger btn-sm rounded-pill" onclick="logout()">
                <i class="bi bi-box-arrow-right"></i> Keluar
            </button>
        </div>
    </nav>

    <div class="container px-3">
        <div class="input-group mb-3 shadow-sm rounded-pill overflow-hidden">
            <span class="input-group-text bg-body border-end-0"><i class="bi bi-search text-muted"></i></span>
            <input type="text" id="searchInput" class="form-control border-start-0 ps-0" placeholder="Cari catatan...">
        </div>

        <div class="list-group list-group-flush shadow-sm rounded-3 overflow-hidden" id="notesList">
            <div class="text-center p-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Mengambil data...</p>
            </div>
        </div>

        <div id="emptyState" class="text-center mt-5 d-none">
            <i class="bi bi-journal-plus display-1 text-muted opacity-25"></i>
            <p class="text-muted mt-3">Belum ada catatan. Mulai menulis sekarang!</p>
        </div>
    </div>

    <button class="btn btn-primary btn-fab" onclick="location.href='detail.html'">
        <i class="bi bi-plus-lg fs-4"></i>
    </button>

    <script>
        const SUPABASE_URL = "https://iigxskarhafefuaeqdwh.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpZ3hza2FyaGFmZWZ1YWVxZHdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MTE5ODYsImV4cCI6MjA5MjA4Nzk4Nn0.vp4azKtcArAvi229IAA-DwgS-xdYtFbyMKE69_HGNL4";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function checkSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            const isAdmin = localStorage.getItem('admin_session');
            if (!session && !isAdmin) window.location.href = 'login.html';
            else renderNotes();
        }

        async function renderNotes() {
            const listContainer = document.getElementById('notesList');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const { data: { user } } = await _supabase.auth.getUser();
            const userId = user ? user.id : 'admin_mode';

            let query = _supabase.from('notes').select('*');
            if (userId !== 'admin_mode') query = query.eq('user_id', userId);
            else query = query.eq('user_id', 'admin_mode');

            const { data: notes, error } = await query.order('id', { ascending: false });

            if (error) { console.error(error); return; }

            const filtered = notes.filter(n => 
                n.title.toLowerCase().includes(searchTerm) || 
                n.content.toLowerCase().includes(searchTerm)
            );

            listContainer.innerHTML = '';
            if (filtered.length === 0) {
                document.getElementById('emptyState').classList.remove('d-none');
            } else {
                document.getElementById('emptyState').classList.add('d-none');
                filtered.forEach(note => {
                    const item = document.createElement('a');
                    item.className = 'list-group-item list-group-item-action note-item py-3 px-3';
                    item.href = `detail.html?id=${note.id}`;
                    item.innerHTML = `
                        <div class="d-flex w-100 justify-content-between align-items-center">
                            <h6 class="mb-1 fw-bold text-truncate" style="max-width: 75%;">${note.title || 'Tanpa Judul'}</h6>
                            <small class="text-muted" style="font-size: 0.7rem;">${new Date(note.created_at).toLocaleDateString()}</small>
                        </div>
                        <p class="mb-1 preview-text">${note.content.substring(0, 100) || 'Kosong'}</p>
                        <span class="badge bg-primary-subtle text-primary rounded-pill mt-1" style="font-size: 0.65rem;">${note.subject}</span>
                    `;
                    listContainer.appendChild(item);
                });
            }
        }

        async function logout() {
            await _supabase.auth.signOut();
            localStorage.removeItem('admin_session');
            window.location.href = 'login.html';
        }

        document.getElementById('searchInput').addEventListener('input', renderNotes);
        window.onload = checkSession;
    </script>
</body>
</html>
