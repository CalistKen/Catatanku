<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor - Catatanku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        .editor-area { border: none; outline: none; resize: none; width: 100%; min-height: 400px; background: transparent; font-size: 1.1rem; }
        .preview-mode { display: none; min-height: 400px; line-height: 1.6; }
    </style>
</head>
<body class="bg-body">

    <nav class="navbar sticky-top bg-body border-bottom">
        <div class="container-fluid px-3">
            <button onclick="location.href='index.html'" class="btn btn-link text-decoration-none p-0">
                <i class="bi bi-chevron-left fs-4"></i>
            </button>
            <div class="flex-grow-1 ms-3">
                <h6 class="mb-0 fw-bold" id="pageTitle">Catatan Baru</h6>
            </div>
            <button class="btn btn-light btn-sm me-2 d-none" id="deleteBtn"><i class="bi bi-trash text-danger"></i></button>
            <button class="btn btn-primary btn-sm rounded-pill px-3" id="saveBtn" onclick="saveNote()">Simpan</button>
        </div>
    </nav>

    <div class="container py-3">
        <input type="text" id="titleInput" class="form-control form-control-lg border-0 fw-bold mb-1 shadow-none px-0" placeholder="Judul Catatan">
        <select id="subjectInput" class="form-select form-select-sm w-auto mb-3 rounded-pill bg-light border-0 shadow-none">
            <option value="Matematika">Matematika</option>
            <option value="IPA">IPA</option>
            <option value="IPS">IPS</option>
            <option value="Lainnya">Lainnya</option>
        </select>
        <ul class="nav nav-underline mb-3 border-bottom" id="noteTabs">
            <li class="nav-item"><a class="nav-link active" href="#" id="editTab">Tulis</a></li>
            <li class="nav-item"><a class="nav-link" href="#" id="previewTab">Pratinjau Rumus</a></li>
        </ul>
        <div id="editorContainer">
            <textarea id="contentInput" class="editor-area" placeholder="Tuliskan isi catatan..."></textarea>
        </div>
        <div id="previewContainer" class="preview-mode py-2"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://iigxskarhafefuaeqdwh.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpZ3hza2FyaGFmZWZ1YWVxZHdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MTE5ODYsImV4cCI6MjA5MjA4Nzk4Nn0.vp4azKtcArAvi229IAA-DwgS-xdYtFbyMKE69_HGNL4";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const noteId = urlParams.get('id');
        const titleInput = document.getElementById('titleInput');
        const subjectInput = document.getElementById('subjectInput');
        const contentInput = document.getElementById('contentInput');
        const deleteBtn = document.getElementById('deleteBtn');

        async function loadNote() {
            if (noteId) {
                const { data, error } = await _supabase.from('notes').select('*').eq('id', noteId).single();
                if (data) {
                    document.getElementById('pageTitle').innerText = "Edit Catatan";
                    titleInput.value = data.title;
                    subjectInput.value = data.subject;
                    contentInput.value = data.content;
                    deleteBtn.classList.remove('d-none');
                }
            }
        }

        async function saveNote() {
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

            const { data: { user } } = await _supabase.auth.getUser();
            const userId = user ? user.id : 'admin_mode';

            const payload = {
                title: titleInput.value || "Tanpa Judul",
                subject: subjectInput.value,
                content: contentInput.value,
                user_id: userId
            };

            let error;
            if (noteId) {
                const { error: err } = await _supabase.from('notes').update(payload).eq('id', noteId);
                error = err;
            } else {
                const { error: err } = await _supabase.from('notes').insert([payload]);
                error = err;
            }

            if (error) { alert("Gagal menyimpan: " + error.message); saveBtn.disabled = false; saveBtn.innerText = "Simpan"; }
            else location.href = 'index.html';
        }

        deleteBtn.onclick = async () => {
            if (confirm("Hapus catatan ini secara permanen?")) {
                const { error } = await _supabase.from('notes').delete().eq('id', noteId);
                if (!error) location.href = 'index.html';
            }
        };

        const previewTab = document.getElementById('previewTab');
        const editTab = document.getElementById('editTab');
        const previewContainer = document.getElementById('previewContainer');
        const editorContainer = document.getElementById('editorContainer');

        previewTab.onclick = (e) => {
            e.preventDefault();
            editTab.classList.remove('active'); previewTab.classList.add('active');
            editorContainer.classList.add('d-none'); previewContainer.classList.remove('d-none');
            previewContainer.innerHTML = contentInput.value.replace(/\n/g, '<br>');
            renderMathInElement(previewContainer, {
                delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}],
                throwOnError: false
            });
        };

        editTab.onclick = (e) => {
            e.preventDefault();
            previewTab.classList.remove('active'); editTab.classList.add('active');
            previewContainer.classList.add('d-none'); editorContainer.classList.remove('d-none');
        };

        window.onload = loadNote;
    </script>
</body>
</html>
