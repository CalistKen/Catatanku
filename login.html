<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Catatanku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        #splash-screen {
            position: fixed; inset: 0; background: white; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease-out;
        }
        [data-bs-theme="dark"] #splash-screen { background: #1a1d20; }
        .loader { width: 48px; height: 48px; border: 5px solid #3b82f6; border-bottom-color: transparent; border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .auth-card { max-width: 400px; width: 100%; border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="bg-body-tertiary d-flex align-items-center justify-content-center vh-100 px-3">

    <div id="splash-screen">
        <div class="loader mb-3"></div>
        <h4 class="fw-bold text-primary">Catatanku</h4>
        <p class="text-muted small">Mempersiapkan lingkungan...</p>
    </div>

    <div class="card auth-card bg-body p-4 d-none" id="loginContent">
        <div class="text-center mb-4">
            <h3 class="fw-bold">Selamat Datang</h3>
            <p class="text-muted small">Kelola catatan belajarmu dengan mudah</p>
        </div>

        <button onclick="loginGoogle()" class="btn btn-outline-dark w-100 mb-3 d-flex align-items-center justify-content-center gap-2 py-2">
            <i class="bi bi-google"></i> Masuk dengan Google
        </button>

        <div class="d-flex align-items-center my-3 text-muted">
            <hr class="flex-grow-1"> <span class="mx-2 small">Atau</span> <hr class="flex-grow-1">
        </div>

        <ul class="nav nav-pills nav-fill mb-3 bg-light p-1 rounded-pill" id="pills-tab" role="tablist">
            <li class="nav-item"><button class="nav-link active rounded-pill py-1" data-bs-toggle="pill" data-bs-target="#email-login">Email</button></li>
            <li class="nav-item"><button class="nav-link rounded-pill py-1" data-bs-toggle="pill" data-bs-target="#special-login">Special</button></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="email-login">
                <input type="email" id="email" class="form-control mb-2" placeholder="Email">
                <input type="password" id="password" class="form-control mb-3" placeholder="Password">
                <button onclick="loginEmail()" class="btn btn-primary w-100 py-2 mb-2">Masuk</button>
                <button onclick="signUpEmail()" class="btn btn-link w-100 btn-sm text-decoration-none text-muted">Belum punya akun? Daftar</button>
            </div>
            <div class="tab-pane fade" id="special-login">
                <p class="text-center x-small text-muted mb-3" style="font-size: 0.75rem;">Gunakan kredensial khusus dari Administrator</p>
                <input type="text" id="adminUser" class="form-control mb-2" placeholder="Username Admin">
                <input type="password" id="adminKey" class="form-control mb-3" placeholder="Access Key">
                <button onclick="loginSpecial()" class="btn btn-dark w-100 py-2">Otentikasi Key</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://iigxskarhafefuaeqdwh.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpZ3hza2FyaGFmZWZ1YWVxZHdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MTE5ODYsImV4cCI6MjA5MjA4Nzk4Nn0.vp4azKtcArAvi229IAA-DwgS-xdYtFbyMKE69_HGNL4";
        // Variabel diubah jadi _supabase agar tidak bentrok
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                document.getElementById('loginContent').classList.remove('d-none');
                setTimeout(() => splash.remove(), 500);
            }, 2500);
        });

        async function loginGoogle() {
            await _supabase.auth.signInWithOAuth({ provider: 'google' });
        }

        async function loginEmail() {
    const emailInput = document.getElementById('email').value.trim();
    const passwordInput = document.getElementById('password').value.trim();

    if (!emailInput || !passwordInput) {
        alert("Ops! Email dan Password harus diisi.");
        return;
    }

    const { data, error } = await _supabase.auth.signInWithPassword({
        email: emailInput,
        password: passwordInput
    });

    if (error) {
        alert("Gagal Login: " + error.message);
    } else {
        window.location.href = 'index.html';
    }
}

async function signUpEmail() {
    const emailInput = document.getElementById('email').value.trim();
    const passwordInput = document.getElementById('password').value.trim();

    if (!emailInput || !passwordInput) {
        alert("Isi dulu email dan passwordnya ya!");
        return;
    }

    if (passwordInput.length < 6) {
        alert("Keamanan utama! Password minimal 6 karakter.");
        return;
    }

    const { data, error } = await _supabase.auth.signUp({
        email: emailInput,
        password: passwordInput
    });

    if (error) {
        alert("Gagal Daftar: " + error.message);
    } else {
        alert("Pendaftaran berhasil! Silakan coba login sekarang.");
    }
}


        function loginSpecial() {
            const user = document.getElementById('adminUser').value;
            const key = document.getElementById('adminKey').value;
            if(user === "aji_admin" && key === "2026_SUKSES") {
                localStorage.setItem('admin_session', 'true');
                window.location.href = 'index.html';
            } else {
                alert("Key Administrator tidak valid!");
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
